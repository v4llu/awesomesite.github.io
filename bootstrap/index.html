<!doctype html>
<html lang="en">
  <head>
    <script src="https://unpkg.com/webamp@1.4.0/built/webamp.bundle.min.js"></script>
    <style>
h1 {text-align: center;}
p {text-align: center; font-size: large;}
div {text-align: center;}
a {text-align: center;}

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            animation: page-fade-in 700ms ease-out both;
        }

        @keyframes page-fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .my-block {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .winamp-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            min-height: 300px;
            margin-top: 2rem;
        }

        #winamp-container {
            position: relative;
            width: 100%;
            height: 300px;
            margin: 0 auto;
            text-align: left;
        }

        a {
            transition: color 180ms ease, text-shadow 180ms ease;
        }

        a:hover,
        a:focus-visible {
            color: #4da3ff;
            text-shadow: 0 0 8px rgba(77, 163, 255, 0.65);
        }

        @media (prefers-reduced-motion: reduce) {
            body,
            a {
                animation: none;
                transition: none;
            }
        }
</style>
