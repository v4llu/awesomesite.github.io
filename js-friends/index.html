<!doctype html>
<html lang="en">
    <title>Friend7</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friends List</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body::before {
      content: '';
      position: fixed;
      inset: -8px;
      z-index: -1;
      background: url('background.jpg') center / cover no-repeat;
      filter: blur(4px);
    }
    body.rare-flash::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: rgba(255, 215, 86, 0.4);
      animation: rare-flash 500ms ease-out forwards;
    }
    @keyframes rare-flash {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    main {
      width: 100%;
      overflow: hidden;
      border: 1px solid #0b5394;
      border-radius: 7px;
      background: #f4f8fc;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.75);
    }
    .title-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      color: white;
      background: linear-gradient(#62b6ee, #1875bd 48%, #0d5b9c);
      font-size: 14px;
      font-weight: bold;
      text-shadow: 1px 1px #124b78;
    }
    .title-icon { width: 16px; height: 16px; }
    .heading-icon { width: 24px; height: 24px; margin-right: 7px; vertical-align: middle; }
    .button-icon { width: 14px; height: 14px; margin-right: 4px; vertical-align: text-bottom; }
    .request-icon { width: 16px; height: 16px; margin-right: 5px; vertical-align: text-bottom; }
    .request-actions { margin-top: 7px; }
    .screen { padding: 22px; }
    #startup-screen { color: white; text-align: center; background: linear-gradient(#4ba5dd, #0d5b9c); }
    .startup-logo { width: min(230px, 80%); margin: 18px 0; }
    #save-slots { margin: 16px 0; }
    #save-slots p { margin: 0 0 7px; }
    .save-slot-row { display: flex; gap: 5px; margin: 5px 0; }
    .save-slot { display: flex; flex: 1; align-items: center; gap: 7px; padding: 7px; border: 1px solid #b8e0fa; color: white; background: rgba(0, 63, 117, 0.6); cursor: pointer; text-align: left; }
    .save-slot img { width: 28px; height: 28px; object-fit: cover; }
    .save-slot:hover { background: rgba(38, 128, 188, 0.85); }
    .save-slot.celebrity-slot { border-color: #ffe371; color: #fff5bd; background: linear-gradient(90deg, #8c5a00, #d99d1d); }
    .delete-save { border: 1px solid #a32a2a; color: white; background: #7f1717; cursor: pointer; }
    .logout-button { display: flex; align-items: center; gap: 4px; margin-left: auto; padding: 2px 8px; border: 1px solid #0a467c; border-radius: 2px; color: white; background: #a32929; font: inherit; font-size: 12px; cursor: pointer; }
    .logout-button img { width: 14px; height: 14px; }
    .logout-button[hidden] { display: none; }
    #signup-screen { color: #1e3f5d; }
    #signup-screen h1 { margin-top: 0; font-size: 22px; font-weight: normal; }
    #signup-screen label { display: block; margin: 12px 0 4px; font-size: 13px; }
    #signup-screen input, #signup-screen textarea { width: 100%; box-sizing: border-box; padding: 6px; }
    #signup-screen textarea { resize: none; }
    #signup-preview { width: 48px; height: 48px; margin-top: 8px; vertical-align: middle; object-fit: cover; }
    .picture-menu {
      display: grid;
      grid-template-columns: repeat(8, 34px);
      gap: 4px;
      max-height: 180px;
      padding: 2px;
      overflow-y: auto;
    }
    .picture-choice { padding: 2px; border: 1px solid transparent; background: transparent; cursor: pointer; }
    .picture-choice img { display: block; width: 28px; height: 28px; object-fit: cover; }
    .picture-choice.selected { border-color: #287fbd; background: #d9effc; }
    .windows-button {
      margin-top: 18px;
      padding: 5px 18px;
      border: 1px solid #2b6eab;
      border-radius: 3px;
      color: white;
      background: linear-gradient(#76c2f2, #287fbd);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.55);
      cursor: pointer;
    }
    .windows-button:hover { background: linear-gradient(#8bd1fa, #3d91ca); }
    .windows-button.active { border-color: #f8d45d; background: linear-gradient(#f4ce58, #a66b06); }
    body.celebrity-mode-active main, body.celebrity-mode-active .achievements-window { border-color: #d59a20; }
    body.celebrity-mode-active .title-bar { background: linear-gradient(#ffe991, #c98b16 48%, #8e5600); text-shadow: 1px 1px #704400; }
    #friends-app { color: white; background: rgba(20, 20, 20, 0.72); }
    #friends-app[hidden], #signup-screen[hidden], #startup-screen[hidden] { display: none; }
    #friends-app .screen { background: url('ui-bg.jpg') center / cover; background-blend-mode: multiply; }
    #friends-app .screen { background-color: rgba(20, 20, 20, 0.72); }
    #friends-app h1 { margin-top: 0; }
    #friends-app .screen { text-shadow: 0 0 5px #000; }
    #friends-app input { color: black; }
    .profile { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; }
    .profile img { width: 52px; height: 52px; object-fit: cover; }
    .profile p { margin: 3px 0 0; }
    .level-info { margin: 0 0 8px; font-size: 12px; }
    .xp-bar { width: 150px; height: 8px; margin-top: 3px; border: 1px solid #143d5c; background: #091c2a; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #62d5ff, #2176c1); transition: width 200ms ease; }
    #achievement-area {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      pointer-events: none;
    }
    #status-area {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 2;
      pointer-events: none;
    }
    .status-popup {
      display: flex;
      align-items: center;
      width: 240px;
      padding: 10px 12px;
      border: 1px solid #2b6eab;
      color: #163d5c;
      background: #eaf6ff;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
      animation: status-slide 4s ease-in-out forwards;
    }
    .status-popup img { width: 20px; height: 20px; margin-right: 8px; }
    @keyframes status-slide {
      0%, 100% { opacity: 0; transform: translateY(80px); }
      12%, 88% { opacity: 1; transform: translateY(0); }
    }
    .achievements-button {
      position: fixed;
      top: 50%;
      left: calc(50% + 238px);
      transform: translateY(-50%);
      z-index: 2;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      width: 74px;
      margin: 4px 0;
      padding: 4px;
      border: 1px solid transparent;
      color: white;
      background: transparent;
      font: inherit;
      font-size: 12px;
      text-shadow: 1px 1px #000;
      cursor: pointer;
    }
    .achievements-button[hidden] { display: none; }
    .themes-button { left: auto; right: calc(50% + 238px); }
    .themes-menu {
      position: fixed;
      top: calc(50% + 50px);
      right: calc(50% + 228px);
      z-index: 2;
      width: 130px;
      padding: 8px;
      border: 1px solid #2b6eab;
      color: #173f60;
      background: #eef6fc;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
      font-size: 12px;
    }
    .themes-menu[hidden] { display: none; }
    .themes-menu select { width: 100%; margin-top: 4px; }
    .friends-shell { position: relative; }
    .friends-shell { width: min(440px, calc(100% - 32px)); }
    #theme-fade {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      opacity: 0;
      background: #000;
      transition: opacity 250ms ease;
    }
    #theme-fade.active { opacity: 1; }
    body.gangster-edition::before { background-image: url('gangster-bg.jpg'); }
    body.gangster-edition main, body.gangster-edition .achievements-window { border-color: #a81515; }
    body.gangster-edition .title-bar { background: linear-gradient(#7a1010, #3a0000 48%, #150000); }
    body.gangster-edition #friends-app, body.gangster-edition #friends-app .screen { background: #000; background-image: none; }
    body.gangster-edition .xp-bar { border-color: #a81515; background: #180000; }
    body.gangster-edition .xp-bar-fill { background: linear-gradient(90deg, #ff5b5b, #a81515); }
    body.xbox360-edition::before { background-image: url('xbox360-bg.jpg'); }
    body.xbox360-edition main, body.xbox360-edition .achievements-window { border-color: #78b82a; }
    body.xbox360-edition .title-bar { background: linear-gradient(#a4d955, #5f9c1b 48%, #3d6f12); text-shadow: 1px 1px #355b10; }
    body.xbox360-edition #friends-app, body.xbox360-edition #friends-app .screen { background: url('xbox360-ui-bg.jpg') center / cover; background-color: transparent; }
    body.xbox360-edition .xp-bar { border-color: #78b82a; background: #23470d; }
    body.xbox360-edition .xp-bar-fill { background: linear-gradient(90deg, #c5ed6d, #78b82a); }
    body.night-edition::before { background-image: url('night-bg.jpg'); }
    body.night-edition main, body.night-edition .achievements-window { border-color: #888; }
    body.night-edition .title-bar { background: linear-gradient(#555, #292929 48%, #111); text-shadow: 1px 1px #000; }
    body.night-edition #friends-app, body.night-edition #friends-app .screen { background: url('night-ui-bg.jpg') center / cover; background-color: transparent; }
    body.night-edition .xp-bar { border-color: #aaa; background: #222; filter: grayscale(1); }
    body.night-edition .xp-bar-fill { background: linear-gradient(90deg, #ddd, #666); }
    body.steam-edition { font-family: Arial, sans-serif; }
    body.steam-edition::before { background-image: url('steam-bg.jpg'); }
    body.steam-edition main, body.steam-edition .achievements-window { border-color: #1b2838; }
    body.steam-edition .title-bar { background: linear-gradient(#263b52, #1b2838 48%, #101923); text-shadow: 1px 1px #000; }
    body.steam-edition #friends-app, body.steam-edition #friends-app .screen { background: url('steam-ui-bg.png') center / cover; background-color: transparent; }
    body.steam-edition .xp-bar { border-color: #3b6280; background: #142333; }
    body.steam-edition .xp-bar-fill { background: linear-gradient(90deg, #66c0f4, #3b7da7); }
    body.halflife-edition { font-family: 'Trebuchet MS', sans-serif; }
    body.halflife-edition::before { background-image: url('hl-bg.jpg'); }
    body.halflife-edition main, body.halflife-edition .achievements-window { border-color: #a7ad81; }
    body.halflife-edition .title-bar { background: linear-gradient(#606f51, #3d4935 48%, #2c3627); text-shadow: 1px 1px #172016; }
    body.halflife-edition #friends-app, body.halflife-edition #friends-app .screen { background: url('hl-ui-bg.jpg') center / cover; background-color: #303b2a; }
    body.halflife-edition .xp-bar { border-color: #a7ad81; background: #20291c; }
    body.halflife-edition .xp-bar-fill { background: linear-gradient(90deg, #d3d98d, #7e9460); }
    body.passion-edition { font-family: 'Comic Sans MS', 'Comic Sans', cursive; }
    body.passion-edition::before { background-image: url('passion-bg.jpg'); }
    body.passion-edition main, body.passion-edition .achievements-window { border-color: #ff3aa7; border-image: linear-gradient(135deg, #ff2d55, #ffcc00, #36d96d, #26a7ff, #9d4edd) 1; }
    body.passion-edition .title-bar { background: linear-gradient(90deg, #ff2d55, #ff9f1c, #f8e71c, #3bd671, #22a6f2, #9b59ff, #ff2d55); background-size: 200% 100%; color: #fff; text-shadow: 1px 1px #72215d; }
    body.passion-edition #friends-app, body.passion-edition #friends-app .screen { background: url('passion-ui-bg.jpg') center / cover; background-color: transparent; }
    body.passion-edition .xp-bar { border-color: #ff57be; background: #44225a; }
    body.passion-edition .xp-bar-fill { background: linear-gradient(90deg, #ff2d55, #ffcc00, #36d96d, #26a7ff, #9d4edd); }
    #boot-fade {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: #000;
      animation: boot-fade 1.2s ease-out forwards;
    }
    @keyframes boot-fade {
      to { opacity: 0; visibility: hidden; }
    }
    .achievements-button img { width: 40px; height: 40px; margin-bottom: 3px; }
    .achievements-button:hover, .achievements-button:focus-visible { border-color: #8bc9f1; background: rgba(77, 157, 213, 0.45); outline: none; }
    #achievements-panel[hidden] { display: none; }
    #achievements-panel {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.45);
    }
    .achievements-window {
      width: min(380px, 100%);
      overflow: hidden;
      border: 1px solid #0b5394;
      border-radius: 7px;
      background: #eef6fc;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.65);
    }
    .achievements-content { padding: 16px; color: #183e5d; }
    .achievements-content h2 { margin: 0 0 8px; font-size: 19px; }
    #achievements-list { display: grid; gap: 7px; max-height: 300px; overflow-y: auto; }
    .achievement-item { display: flex; align-items: center; gap: 8px; padding: 7px; border: 1px solid #b7cddd; background: white; }
    .achievement-item img { width: 30px; height: 30px; }
    .achievement-item.locked { opacity: 0.5; }
    .achievement-item.locked img { filter: grayscale(1); }
    .achievement-item.special:not(.locked) { border-color: #d6a526; box-shadow: 0 0 7px rgba(230, 181, 46, 0.75); }
    .achievement-item small { display: block; }
    .achievement-popup {
      display: flex;
      align-items: center;
      width: 260px;
      padding: 12px;
      border: 1px solid #6c9fca;
      color: white;
      background: linear-gradient(#29465d, #152a3a);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
      animation: achievement-slide 4s ease-in-out forwards;
    }
    .achievement-popup img { width: 42px; height: 42px; margin-right: 10px; }
    .achievement-popup.special { border-color: #ffd45c; box-shadow: 0 0 18px #e6b52e, 0 3px 12px rgba(0, 0, 0, 0.55); }
    .achievement-popup strong, .achievement-popup span { display: block; }
    .achievement-popup span { margin-top: 3px; font-size: 13px; }
    @keyframes achievement-slide {
      0%, 100% { opacity: 0; transform: translateY(120px); }
      12%, 88% { opacity: 1; transform: translateY(0); }
    }
    input { color: black; }
    li { margin: 6px 0; }
    .profile-picture { width: 40px; height: 40px; margin-right: 8px; vertical-align: middle; object-fit: cover; }
    .rare-name {
      font-weight: bold;
      color: #ffd34d;
      background: linear-gradient(#fff6b5, #f2bd22 48%, #fff1a0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 5px rgba(255, 201, 45, 0.8);
    }
    .remove { margin-left: 8px; }
    #friend-request { margin: 16px 0; }
    .friends-sort { margin: 0 0 10px; }
    .friends-sort label { margin-right: 5px; }
    @media (max-width: 620px) {
      .achievements-button { left: auto; right: 8px; }
      .themes-button { right: auto; left: 8px; }
      .themes-menu { right: auto; left: 8px; }
    }
  </style>
</head>
<body>
  <div id="boot-fade" aria-hidden="true"></div>
  <div id="theme-fade" aria-hidden="true"></div>
  <div id="achievement-area" aria-live="polite"></div>
  <div id="status-area" aria-live="polite"></div>
  <div id="achievements-panel" hidden>
    <section class="achievements-window" role="dialog" aria-modal="true" aria-labelledby="achievements-title">
      <div class="title-bar"><img class="title-icon" src="w7/friends.png" alt="" />Achievements</div>
      <div class="achievements-content">
        <h2 id="achievements-title">Friendship achievements</h2>
        <p id="achievement-progress"></p>
        <div id="achievements-list"></div>
        <button class="windows-button" id="close-achievements" type="button">Close</button>
      </div>
    </section>
  </div>
  <div class="friends-shell">
  <main>
    <div class="title-bar">
      <img class="title-icon" id="title-icon" src="w7/login.png" alt="" />
      <span id="window-title">Welcome</span>
      <button class="logout-button" id="logout-button" type="button" hidden><img src="w7/logout.png" alt="" />Logout</button>
    </div>
    <audio id="startup-sound" src="startup.mp3" preload="auto"></audio>
    <audio id="signup-sound" src="signup.mp3" preload="auto"></audio>
    <audio id="logout-sound" src="signout.mp3" preload="auto"></audio>
    <audio id="gangster-audio" src="gangster-audio.mp3" preload="auto"></audio>
    <audio id="xbox360-audio" src="xbox360-audio.mp3" preload="auto"></audio>
    <audio id="night-audio" src="night-audio.mp3" preload="auto"></audio>
    <audio id="steam-audio" src="steam-audio.mp3" preload="auto"></audio>
    <audio id="halflife-audio" src="hl2-audio.mp3" preload="auto"></audio>
    <audio id="passion-audio" src="passion-audio.mp3" preload="auto"></audio>
    <section class="screen" id="startup-screen">
      <img class="startup-logo" src="friend7logo.png" alt="Friends List" />
      <p>Welcome to Friend7!</p>
      <div id="save-slots">
        <p>Choose a save slot</p>
        <div id="save-slot-list"></div>
      </div>
      <p id="startup-message" aria-live="polite"></p>
      <button class="windows-button" id="start-friends-list" type="button">Start</button>
    </section>
    <section class="screen" id="signup-screen" hidden>
      <h1>Create your account</h1>
      <p>Sign up to start using Friends List.</p>
      <form id="signup-form">
        <label for="signup-name">Display name</label>
        <input id="signup-name" type="text" autocomplete="name" maxlength="32" pattern="[A-Za-z0-9 _-]+" required />
        <p id="signup-message" aria-live="polite"></p>
        <label for="signup-picture">Profile picture</label>
        <div class="picture-menu" id="signup-picture" aria-label="Choose a profile picture"></div>
        <img id="signup-preview" alt="Selected profile picture" />
        <label for="signup-bio">Bio</label>
        <textarea id="signup-bio" rows="3" maxlength="120" placeholder="Tell your friends about yourself"></textarea>
        <button class="windows-button" id="celebrity-mode" type="button" aria-pressed="false">Celebrity Mode</button>
        <button class="windows-button" type="submit">Sign up</button>
      </form>
    </section>

    <section id="friends-app" hidden>
      <div class="screen">
        <h1><img class="heading-icon" src="w7/friends.png" alt="" />Friends List</h1>
        <p class="subtitle">Add someone to your list, or remove them anytime.</p>
        <audio id="notification-sound" src="notification.mp3" preload="auto"></audio>
        <audio id="achievement-sound" src="achievement.mp3" preload="auto"></audio>
        <audio id="special-achievement-sound" src="special-achievement.mp3" preload="auto"></audio>
        <audio id="request-sent-sound" src="request-sent.mp3" preload="auto"></audio>
        <audio id="request-accepted-sound" src="request-accepted.mp3" preload="auto"></audio>
        <audio id="rare-request-accepted-sound" src="rare_request-accepted.mp3" preload="auto"></audio>
        <audio id="request-declined-sound" src="request-declined.mp3" preload="auto"></audio>
        <div class="profile" id="my-profile" hidden></div>
        <div class="level-info" id="level-display" hidden>
          <div id="level-label"></div>
          <div class="xp-bar"><div class="xp-bar-fill" id="xp-bar-fill"></div></div>
        </div>

        <form id="friend-form">
          <input id="friend-name" type="text" placeholder="Username" autocomplete="off" maxlength="32" pattern="[A-Za-z0-9 _-]+" required />
          <button type="submit">Send request</button>
        </form>
        <p id="friend-message" aria-live="polite"></p>

        <p class="count" id="friend-count">0 friends</p>
        <div class="friends-sort">
          <label for="friends-sort">Sort friends:</label>
          <select id="friends-sort">
            <option value="latest">Latest added</option>
            <option value="alphabetical">Alphabetical</option>
            <option value="rarity">Rarity</option>
          </select>
        </div>
        <div id="friend-request" aria-live="polite"></div>
        <ul id="friends-list" aria-live="polite"></ul>
      </div>
    </section>

    function saveKey(slot) {
      return `friend7-save-slot-${slot}`;
    }

    function readSaveSlot(slot) {
      try {
        const saved = localStorage.getItem(saveKey(slot));
        return saved ? JSON.parse(saved) : null;
      } catch {
        return null;
      }
    }

    function renderSaveSlots() {
      saveSlotList.innerHTML = '';
      for (let slot = 1; slot <= 3; slot += 1) {
        const saved = readSaveSlot(slot);
        const row = document.createElement('div');
        const button = document.createElement('button');
        const icon = document.createElement('img');
        const label = document.createElement('span');
        row.className = 'save-slot-row';
        button.className = 'save-slot';
        button.type = 'button';
        icon.src = saved?.profilePicture || 'icons/1.png';
        icon.alt = '';
        label.textContent = saved ? `Slot ${slot}: ${saved.username}` : `Slot ${slot}: New profile`;
        button.append(icon, label);
        if (saved?.celebrityMode) button.classList.add('celebrity-slot');
        button.addEventListener('click', () => {
          if (saved) loadSaveSlot(slot);
          else {
            beginNewSave(slot);
            enterSignup();
          }
        });
        row.append(button);
        if (saved) {
          const deleteButton = document.createElement('button');
          deleteButton.className = 'delete-save';
          deleteButton.type = 'button';
          deleteButton.textContent = 'Delete';
          deleteButton.addEventListener('click', () => {
            if (!window.confirm(`Delete save slot ${slot}?`)) return;
            localStorage.removeItem(saveKey(slot));
            renderSaveSlots();
          });
          row.append(deleteButton);
        }
        saveSlotList.append(row);
      }
    }

        bio: currentBio,
        username: currentUsername,

        theme: themeSelect.value

      try {
        localStorage.setItem(saveKey(activeSaveSlot), JSON.stringify(saveData));
        renderSaveSlots();
      } catch {
        // Browser storage may be unavailable in private/restricted sessions.
      }

    const usersWhoDoNotAcceptRequests = new Set([
      'administrator', 'gabe newell', 'vallu', 'hacker', 'drake', 'yung lean',
      'microsoft', 'steve jobs', 'illuminati', 'bladee', 'ecco2k',
      'thaiboy digital', 'vitun luumu', 'osamason', 'chief keef', 'github',
      'spotify', 'soundcloud', 'google', 'youareanidiot', 'discord', 'faze',
      'friend7_hater', 'adobe', 'phoon', '[ content deleted ]', 'roblox',
      'doge', 'pewdiepie', 'jacksepticeye', 'markiplier', 'dinnerbone',
      'ripsquad', '1exposed', 'bonzibuddy', 'youtube', 'twikipedia',
      'icedancer', 'eversince', 'rainworld', 'fakeadministrator', 'troll',
      'xaviersobased',
    ]);
    const bannedUsernames = new Set(['yassir', 'hexagon', 'ollum', 'rapist', 'epstein', 'nigga', 'nigger', 'faggot', 'gook', 'tranny', 'rape', 'diddy', 'pyhe', 'tom nuke npc', '764', 'n166er', 'n1gg3r']);
    const prohibitedSignupTerms = ['nigga', 'nigger', 'faggot', 'gook', 'tranny'];

    let selectedSignupPicture = 'icons/1.png';

    function updateSignupPreview() {
      signupPreview.src = selectedSignupPicture;
      document.querySelectorAll('.picture-choice').forEach((button) => {
        button.classList.toggle('selected', button.dataset.picture === selectedSignupPicture);
      });
    }

    iconNumbers.forEach((number) => {
      const picture = `icons/${number}.png`;
      const button = document.createElement('button');
      const image = document.createElement('img');
      button.className = 'picture-choice';
      button.type = 'button';
      button.dataset.picture = picture;
      button.title = `Icon ${number}`;
      image.src = picture;
      image.alt = `Icon ${number}`;
      button.append(image);
      button.addEventListener('click', () => {
        selectedSignupPicture = picture;
        updateSignupPreview();
      });
      signupPictureMenu.append(button);
    });
    updateSignupPreview();

    function unlockNotificationSound() {
      notificationSound.muted = true;
      notificationSound.play()
        .then(() => {
          notificationSound.pause();
          notificationSound.currentTime = 0;
          notificationSound.muted = false;
          notificationSoundUnlocked = true;
        })
        .catch(() => { notificationSound.muted = false; });
    }

    document.addEventListener('pointerdown', unlockNotificationSound, { once: true });
    document.addEventListener('keydown', unlockNotificationSound, { once: true });

    startFriendsListButton.addEventListener('click', () => {
      const emptySlot = [1, 2, 3].find((slot) => !readSaveSlot(slot));
      if (!emptySlot) {
        startupMessage.textContent = 'Choose an existing save slot to continue.';
        return;
      }
      beginNewSave(emptySlot);
      enterSignup();
    });

    function loadUsernames() {
      usernames = usernamesData.textContent
        .split(/\r?\n/)
        .map((name) => name.trim())
        .filter(Boolean);
    }

    function storedUsernameExists(name) {
      const normalizedName = name.toLowerCase();
      return usernamesData.textContent
        .split(/\r?\n/)
        .map((username) => username.trim().toLowerCase())
        .filter(Boolean)
        .includes(normalizedName);
    }

    function canonicalUsername(name) {
      const normalizedName = name.toLowerCase();
      const storedName = usernamesData.textContent
        .split(/\r?\n/)
        .map((username) => username.trim())
        .find((username) => username.toLowerCase() === normalizedName);
      return storedName || name;
    }

    function updateLevelDisplay() {
      if (!levelInfo) return;
      const level = Math.floor(totalXp / 100) + 1;
      const xpInLevel = totalXp % 100;
      levelInfo.label.textContent = `Level ${level} — ${xpInLevel} / 100 XP`;
      levelInfo.fill.style.width = `${xpInLevel}%`;
    }

    function gainXp(amount) {
      checkForTampering();
      totalXp += amount * (celebrityMode ? 10 : 1);
      updateLevelDisplay();
      saveProgress();
    }

    function checkForTampering() {
      const currentRulesSignature = JSON.stringify({ xpRewards, milestones: achievementMilestones });
      if (currentRulesSignature !== expectedRulesSignature) {
        unlockSpecialAchievement('cheater');
      }
    }

    function isValidUsername(name) {
      return /^[A-Za-z0-9 _-]{1,32}$/.test(name);
    }

    function containsProhibitedSignupTerm(name) {
      const normalizedName = name.toLowerCase().replace(/[^a-z]/g, '');
      return prohibitedSignupTerms.some((term) => normalizedName.includes(term));
    }

    function showFriendRequest() {
      if (!sessionActive || !usernames.length || pendingRequest) return;

      const eligibleUsernames = usernames.filter((name) => !isAlreadyFriend(name));
      if (!eligibleUsernames.length) return;

      const name = eligibleUsernames[Math.floor(Math.random() * eligibleUsernames.length)];
      const requestIndex = usernames.indexOf(name);
      usernames.splice(requestIndex, 1);
      pendingRequest = { name, picture: profilePictureFor(name) };
      gainXp(xpRewards.receivedRequest);
      if (isRareUser(name)) gainXp(xpRewards.rareReceivedRequest);
      requestArea.innerHTML = '';

      const message = document.createElement('span');
      const requestName = document.createElement('span');
      const infoIcon = document.createElement('img');
      const acceptButton = document.createElement('button');
      const declineButton = document.createElement('button');
      const actions = document.createElement('div');
      const acceptIcon = document.createElement('img');
      const declineIcon = document.createElement('img');
      infoIcon.className = 'request-icon';
      infoIcon.src = 'w7/info.png';
      infoIcon.alt = '';
      requestName.textContent = name;
      if (isRareUser(name)) requestName.className = 'rare-name';
      message.append(infoIcon, requestName, ' sent you a friend request. ');
      acceptIcon.className = 'button-icon';
      acceptIcon.src = 'w7/accept.png';
      acceptIcon.alt = '';
      acceptButton.append(acceptIcon, 'Accept');
      declineIcon.className = 'button-icon';
      declineIcon.src = 'w7/decline.png';
      declineIcon.alt = '';
      declineButton.append(declineIcon, 'Decline');
      acceptButton.type = declineButton.type = 'button';

      acceptButton.addEventListener('click', () => {
        const acceptedName = pendingRequest.name;
        if (!isAlreadyFriend(pendingRequest.name)) {
          friends.push(pendingRequest);
        }
        const requestAchievement = specialAchievements.find((achievement) =>
          achievement.requestUsername === pendingRequest.name.toLowerCase()
        );
        if (requestAchievement) unlockSpecialAchievement(requestAchievement.id);
        const acceptanceSound = isRareUser(acceptedName) ? rareRequestAcceptedSound : requestAcceptedSound;
        if (isRareUser(acceptedName)) {
          gainXp(xpRewards.acceptedRareRequest);
          flashRareAcceptance();
        }
        showStatusNotification(`You accepted ${acceptedName}'s friend request.`, 'w7/accept.png', acceptanceSound);
        pendingRequest = null;
        requestArea.innerHTML = '';
        renderFriends();
        scheduleFriendRequest();
      });
      declineButton.addEventListener('click', () => {
        pendingRequest = null;
        requestArea.innerHTML = '';
        scheduleFriendRequest();
      });

      actions.className = 'request-actions';
      actions.append(acceptButton, ' ', declineButton);
      requestArea.append(message, actions);
      if (notificationSoundUnlocked) {
        notificationSound.currentTime = 0;
        notificationSound.play().catch(() => {});
      }
    }

    function scheduleFriendRequest() {
      if (!sessionActive) return;
      const waitTime = celebrityMode
        ? 1000 + Math.random() * 2000
        : 10000 + Math.random() * 50000;
      friendRequestTimer = window.setTimeout(() => {
        if (!sessionActive) return;
        if (Math.random() < (celebrityMode ? 1 : 0.6)) {
          showFriendRequest();
        } else {
          scheduleFriendRequest();
        }
      }, waitTime);
    }

    function isAlreadyFriend(name) {
      return friends.some((friend) => friend.name.toLowerCase() === name.toLowerCase());
    }

    function showStatusNotification(message, iconPath = 'w7/info.png', sound = null) {
      const popup = document.createElement('div');
      const icon = document.createElement('img');
      const text = document.createElement('span');
      popup.className = 'status-popup';
      icon.src = iconPath;
      icon.alt = '';
      text.textContent = message;
      popup.append(icon, text);
      statusArea.append(popup);
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }
      window.setTimeout(() => popup.remove(), 4000);
    }

    function flashRareAcceptance() {
      document.body.classList.remove('rare-flash');
      void document.body.offsetWidth;
      document.body.classList.add('rare-flash');
      window.setTimeout(() => document.body.classList.remove('rare-flash'), 500);
    }

    function checkAchievements() {
      const milestone = achievementMilestones.find((amount) =>
        friends.length >= amount && !unlockedAchievements.has(amount)
      );
      if (!milestone) return;

      unlockedAchievements.add(milestone);
      const isSpecialMilestone = milestone === 500 || milestone === 1000;
      showAchievement('Achievement unlocked!', `${milestone} friends added`, achievementIcons[milestone], isSpecialMilestone);
      if (isSpecialMilestone) flashRareAcceptance();
      renderAchievements();
      saveProgress();
    }

    function showAchievement(titleText, descriptionText, iconPath, isSpecial = false) {
      const popup = document.createElement('div');
      const icon = document.createElement('img');
      const text = document.createElement('div');
      const title = document.createElement('strong');
      const description = document.createElement('span');
      popup.className = `achievement-popup${isSpecial ? ' special' : ''}`;
      icon.src = iconPath;
      icon.alt = '';
      title.textContent = titleText;
      description.textContent = descriptionText;
      text.append(title, description);
      popup.append(icon, text);
      achievementArea.append(popup);
      const sound = isSpecial ? specialAchievementSound : achievementSound;
      sound.currentTime = 0;
      sound.play().catch(() => {});
      window.setTimeout(() => popup.remove(), 4000);
    }

    function unlockSpecialAchievement(id) {
      const achievement = specialAchievements.find((item) => item.id === id);
      if (!achievement || unlockedAchievements.has(id)) return;

      unlockedAchievements.add(id);
      showAchievement(achievement.title, achievement.description, achievement.icon, true);
      renderAchievements();
      saveProgress();
    }

    // Deliberately not exposed in the interface: this is the cheat-only unlock.
    window.friend7Cheat = () => unlockSpecialAchievement('cheater');

    function renderAchievements() {
      achievementsList.innerHTML = '';
      const nextMilestone = achievementMilestones.find((amount) => friends.length < amount);
      achievementProgress.textContent = nextMilestone
        ? `${friends.length} / ${nextMilestone} friends until your next achievement`
        : 'Every friendship achievement unlocked!';

      achievementMilestones.forEach((amount) => {
        const item = document.createElement('div');
        const icon = document.createElement('img');
        const text = document.createElement('div');
        const title = document.createElement('strong');
        const description = document.createElement('small');
        const unlocked = unlockedAchievements.has(amount);
        item.className = `achievement-item${unlocked ? '' : ' locked'}${amount === 500 || amount === 1000 ? ' special' : ''}`;
        icon.src = achievementIcons[amount];
        icon.alt = '';
        title.textContent = `${amount} Friends`;
        description.textContent = unlocked ? 'Unlocked' : `Add ${amount - friends.length} more friend${amount - friends.length === 1 ? '' : 's'}`;
        text.append(title, description);
        item.append(icon, text);
        achievementsList.append(item);
      });

      specialAchievements.forEach((achievement) => {
        const item = document.createElement('div');
        const icon = document.createElement('img');
        const text = document.createElement('div');
        const title = document.createElement('strong');
        const description = document.createElement('small');
        const unlocked = unlockedAchievements.has(achievement.id);
        item.className = `achievement-item${unlocked ? '' : ' locked'}`;
        icon.src = achievement.icon;
        icon.alt = '';
        title.textContent = achievement.hidden && !unlocked ? 'Hidden achievement' : achievement.title;
        description.textContent = achievement.hidden && !unlocked ? 'Keep playing to discover it.' : (unlocked ? 'Unlocked' : achievement.description);
        text.append(title, description);
        item.append(icon, text);
        achievementsList.append(item);
      });
    }

    function renderFriends() {
      list.innerHTML = '';
      count.textContent = `${friends.length} friend${friends.length === 1 ? '' : 's'}`;
      checkAchievements();

      if (friends.length === 0) {
        list.innerHTML = '<li class="empty">Your friends list is empty.</li>';
        renderAchievements();
        saveProgress();
        return;
      }

      const displayedFriends = [...friends].sort((first, second) => {
        if (friendsSort.value === 'alphabetical') return first.name.localeCompare(second.name, undefined, { sensitivity: 'base' });
        if (friendsSort.value === 'rarity') {
          const rarityDifference = Number(isRareUser(second.name)) - Number(isRareUser(first.name));
          return rarityDifference || first.name.localeCompare(second.name, undefined, { sensitivity: 'base' });
        }
        return friends.indexOf(second) - friends.indexOf(first);
      });

      displayedFriends.forEach((friend) => {
        const item = document.createElement('li');
        const picture = document.createElement('img');
        const friendName = document.createElement('span');
        const removeButton = document.createElement('button');

        picture.className = 'profile-picture';
        picture.src = friend.picture;
        picture.alt = `${friend.name}'s profile picture`;
        friendName.className = 'friend';
        if (isRareUser(friend.name)) friendName.classList.add('rare-name');
        friendName.textContent = friend.name;
        removeButton.className = 'remove';
        removeButton.type = 'button';
        removeButton.textContent = 'Remove';
        removeButton.addEventListener('click', () => {
          friends.splice(friends.indexOf(friend), 1);
          renderFriends();
        });

        item.append(picture, friendName, removeButton);
        list.append(item);
      });
      renderAchievements();
      saveProgress();
    }

    friendsSort.addEventListener('change', renderFriends);

    showAchievementsButton.addEventListener('click', () => {
      renderAchievements();
      achievementsPanel.hidden = false;
    });
    closeAchievementsButton.addEventListener('click', () => {
      achievementsPanel.hidden = true;
    });
    showThemesButton.addEventListener('click', () => {
      themesMenu.hidden = !themesMenu.hidden;
    });
    themeSelect.addEventListener('change', () => {
      applyTheme(themeSelect.value);
      themesMenu.hidden = true;
    });
    logoutButton.addEventListener('click', () => {
      saveProgress();
      sessionActive = false;
      if (friendRequestTimer) window.clearTimeout(friendRequestTimer);
      pendingRequest = null;
      requestArea.innerHTML = '';
      friendsApp.hidden = true;
      showAchievementsButton.hidden = true;
      showThemesButton.hidden = true;
      themesMenu.hidden = true;
      logoutButton.hidden = true;
      startupScreen.hidden = false;
      titleIcon.src = 'w7/login.png';
      windowTitle.textContent = 'Welcome';
      logoutSound.currentTime = 0;
      logoutSound.play().catch(() => {});
      themeSelect.value = 'original';
      applyTheme('original', false, false);
      renderSaveSlots();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const typedName = input.value.trim();
      if (!typedName) return;
      if (!isValidUsername(typedName)) {
        friendMessage.textContent = 'Usernames can be up to 32 characters and use only letters, numbers, spaces, dashes, or underscores.';
        showStatusNotification(friendMessage.textContent, 'w7/decline.png', requestDeclinedSound);
        return;
      }
      if (containsProhibitedSignupTerm(typedName)) {
        friendMessage.textContent = 'That username is not allowed.';
        showStatusNotification(friendMessage.textContent, 'w7/decline.png', requestDeclinedSound);
        return;
      }
      const name = canonicalUsername(typedName);
      const requestKey = name.toLowerCase();
      if (requestKey === currentUsername.toLowerCase()) {
        friendMessage.textContent = 'You cannot send a friend request to yourself.';
        showStatusNotification(friendMessage.textContent, 'w7/decline.png', requestDeclinedSound);
        return;
      }
      if (bannedUsernames.has(requestKey)) {
        friendMessage.textContent = 'This user is banned.';
        showStatusNotification(friendMessage.textContent, 'w7/decline.png', requestDeclinedSound);
        return;
      }
      if (usersWhoDoNotAcceptRequests.has(requestKey)) {
        friendMessage.textContent = "This user cannot receive friend requests.";
        showStatusNotification(friendMessage.textContent, 'w7/decline.png', requestDeclinedSound);
        return;
      }
      if (isAlreadyFriend(name)) {
        friendMessage.textContent = `${name} is already on your friends list.`;
        showStatusNotification(friendMessage.textContent);
        return;
      }
      if (outgoingRequests.has(requestKey)) {
        friendMessage.textContent = `A friend request to ${name} is already pending.`;
        showStatusNotification(friendMessage.textContent);
        return;
      }

      outgoingRequests.add(requestKey);
      gainXp(xpRewards.sentRequest);
      friendMessage.textContent = `Friend request sent to ${name}.`;
      showStatusNotification(friendMessage.textContent, 'w7/info.png', requestSentSound);
      input.value = '';
      input.focus();

      const responseTime = 10000 + Math.random() * 50000;
      window.setTimeout(() => {
        outgoingRequests.delete(requestKey);
        if (Math.random() < 0.65) {
          friends.push({ name, picture: profilePictureFor(name) });
          gainXp(xpRewards.acceptedRequest);
          friendMessage.textContent = `${name} accepted your friend request.`;
          renderFriends();
          const acceptanceSound = isRareUser(name) ? rareRequestAcceptedSound : requestAcceptedSound;
          if (isRareUser(name)) flashRareAcceptance();
          showStatusNotification(friendMessage.textContent, 'w7/accept.png', acceptanceSound);
        } else {
          friendMessage.textContent = `${name} declined your friend request.`;
          showStatusNotification(friendMessage.textContent, 'w7/decline.png', requestDeclinedSound);
        }
      }, responseTime);
    });

    signupForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const selectedUsername = signupName.value.trim();
      if (!selectedUsername) {
        signupMessage.textContent = 'Enter a display name.';
        return;
      }
      if (!isValidUsername(selectedUsername)) {
        signupMessage.textContent = 'Usernames can be up to 32 characters and use only letters, numbers, spaces, dashes, or underscores.';
        return;
      }
      if (containsProhibitedSignupTerm(selectedUsername)) {
        signupMessage.textContent = 'That username is not allowed.';
        return;
      }
      if (storedUsernameExists(selectedUsername)) {
        signupMessage.textContent = 'That username is already taken.';
        return;
      }
      signupMessage.textContent = '';
      currentUsername = selectedUsername;
      unlockNotificationSound();
      signupSound.currentTime = 0;
      signupSound.play().catch(() => {});
      currentBio = signupBio.value.trim();
      if (!activeSaveSlot) activeSaveSlot = [1, 2, 3].find((slot) => !readSaveSlot(slot)) || 1;
      openFriendsApp();
      saveProgress();
    });

    renderSaveSlots();
  </script>
</body>
</html>
